[project]
name = "support-bot"
version = "0.9.0"
description = "Telegram-бот поддержки на форум-топиках"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20,<1",
    "APScheduler>=3.10,<4",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "SQLAlchemy>=2.0,<2.1",
    "tzdata>=2024.1",
]

[project.scripts]
support-bot = "support_bot.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["support_bot*"]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
