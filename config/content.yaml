messages:
  start: "<b>Центр поддержки</b>\n\nВыберите вопрос ниже или напишите оператору. Ответ появится в этом чате.\n\n<b>Частые вопросы</b>"
  menu: "<b>Центр поддержки</b>\n\nВыберите вопрос или свяжитесь с оператором.\n\n<b>Частые вопросы</b>"
  feedback_done: "<b>Спасибо за обратную связь!</b>\n\nЕсли понадобится помощь, выберите вопрос ниже или напишите оператору."
  faq_title: "FAQ"
  contact: "Написать в поддержку"
  choose_category: "<b>С чем нужна помощь?</b>\n\nВыберите подходящую категорию."
  describe: "<b>Расскажите, что случилось</b>\n\nОпишите проблему. Укажите устройство, версию приложения и текст ошибки, если они известны."
  add_media: "<b>Добавьте вложение</b>\n\nОтправьте скриншот, видео или файл — так будет проще разобраться. Этот шаг можно пропустить."
  confirm: "<b>Всё верно?</b>\n\nПроверьте обращение и подтвердите отправку."
  ticket_created: "<b>Обращение №{number} создано</b>\n\nМы получили ваше сообщение. Ответ оператора появится в этом чате.\n\nЧтобы удалить копию сообщения у оператора, ответьте на него командой /delete."
  ticket_accepted: "<b>Оператор уже изучает обращение</b>\n\nОбращение №{number} в работе."
  default_greeting: "Здравствуйте! Меня зовут {name}. Сейчас разберёмся с вашим вопросом."
  ticket_closed: "<b>Обращение №{number} закрыто</b>\n\nОцените работу поддержки."
  reopen: "Переоткрыть обращение"
  reopened: "<b>Обращение №{number} снова в работе</b>\n\nПродолжайте переписку в этом чате."
faq:
  - id: account
    question: "Как получить помощь с аккаунтом?"
    answer: "Опишите проблему через форму обращения. Не отправляйте пароли, коды подтверждения и платёжные данные."
  - id: payment
    question: "Как проверить оплату?"
    answer: "Укажите дату и способ оплаты в обращении. Оператор проверит статус и поможет с дальнейшими действиями."
  - id: technical
    question: "Что делать при технической проблеме?"
    answer: "Перезапустите приложение и проверьте подключение к сети. Если ошибка сохраняется, приложите скриншот и опишите шаги перед её появлением."
